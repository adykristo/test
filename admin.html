<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - File not found</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(64px, 10vw, 120px);
      font-weight: 400;
      line-height: 1;
    }

    p {
      margin: 0;
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>File not found</p>
  </main>
</body>
</html>
