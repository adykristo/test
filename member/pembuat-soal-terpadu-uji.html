<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uji Question Studio Fisika Terpadu</title>
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--p:#7b2ff7;--pink:#ff3f9b;--bg:#f7f5fb;--line:#e7dcf4;--text:#251538;--muted:#756a80}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,sans-serif;color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 25px #6d4aff0c}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{background:#f0e8ff;color:#6921bd;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;font-size:12px}select,input,textarea,.workspace{width:100%;border:1px solid #dac9ec;border-radius:10px;padding:10px;background:#fff}.workspace{min-height:220px;overflow:auto;margin-top:10px}.workspace:empty:before{content:attr(data-placeholder);color:#999}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #ddc8f2;border-radius:9px;padding:9px 11px;background:#fff;font-weight:700;cursor:pointer}.primary{background:linear-gradient(90deg,var(--p),var(--pink));color:#fff;border:0}.soft{background:#faf6ff}.editor{display:grid;gap:12px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview{border:1px dashed #cdb4e8;border-radius:12px;padding:14px;min-height:80px}.status{margin-top:10px;padding:9px;border-radius:9px;background:#faf6ff;color:#6b278e}.ai-panel{display:none;margin-top:10px;border:1px solid #ffd0e5;background:#fff8fb;border-radius:12px;padding:12px}.ai-panel.show{display:block}.small{font-size:12px;color:var(--muted)}img.inline{max-width:360px;max-height:260px;display:block;margin:8px 0}.history{font-size:12px;color:var(--muted)}@media(max-width:760px){.grid,.two,.opts{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><div class="wrap">
<div class="card"><div class="head"><div><h2 style="margin:0">⚛️ Question Studio Fisika Terpadu</h2><div class="small">UJI COBA MANDIRI — tidak mengubah V13 utama</div></div><span class="tag">SATU EDITOR</span></div></div>
<div class="card"><b>① SUMBER + WORKSPACE SOAL</b><div class="grid" style="margin-top:12px"><div><label>Jenjang</label><select id="level"><option>SD</option><option>SMP</option><option selected>SMA</option></select></div><div><label>Topik</label><input id="topic" placeholder="mis. Hukum Newton"></div><div><label>Kesulitan</label><select id="difficulty"><option>Mudah</option><option selected>Sedang</option><option>Sulit</option></select></div><div><label>Jenis</label><select id="type"><option value="pg5">PG 5 opsi</option><option value="pg4">PG 4 opsi</option><option value="mcma">MCMA</option><option value="kategori">Kategori</option><option value="isian">Isian</option><option value="esai">Esai</option></select></div></div>
<div id="workspace" class="workspace" contenteditable="true" data-placeholder="Ketik manual, paste teks, Ctrl+V screenshot/foto, drag & drop gambar, atau ketik instruksi AI di sini..."></div>
<div class="tools"><label class="btn">📎 Word/PDF<input id="doc" type="file" accept=".docx,.pdf,application/pdf" hidden></label><label class="btn">🖼 Gambar/Foto<input id="img" type="file" accept="image/*" hidden></label><button class="btn soft" onclick="addFormula()">∑ Rumus</button><button class="btn primary" onclick="parseWorkspace()">✨ Susun ke Editor</button><button class="btn" onclick="clearWork()">🧹 Bersihkan</button></div>
<div class="tools" id="formula"><b style="width:100%;font-size:12px">Toolbar Rumus Fisika</b></div><div id="status" class="status">✓ Editor uji siap.</div></div>

<div class="card"><b>② EDITOR SOAL FISIKA</b><div class="editor" style="margin-top:12px"><div><label>Pertanyaan + Rumus + Gambar</label><textarea id="question" rows="5"></textarea></div><div id="optionsWrap"><label>Opsi / Pernyataan</label><div class="opts" id="options"></div></div><div class="two"><div><label>Kunci Jawaban</label><input id="key" placeholder="A / A,C / jawaban singkat"></div><div><label>Skor</label><input id="score" type="number" value="1" min="0"></div></div><div><label>Pembahasan + Rumus</label><textarea id="explanation" rows="6"></textarea></div></div>
<div class="tools"><button class="btn" onclick="aiSuggest('rapikan')">✨ Rapikan</button><button class="btn" onclick="aiSuggest('hitung')">🧮 Hitung Ulang</button><button class="btn" onclick="aiSuggest('periksa')">🔍 Periksa Fisika</button><button class="btn" onclick="aiSuggest('bahas')">💡 Pembahasan</button><button class="btn" onclick="aiSuggest('variasi')">🔁 Variasi</button><button class="btn" onclick="aiSuggest('sulit')">🎚️ Kesulitan</button><button class="btn" onclick="aiSuggest('latex')">📷 Gambar→LaTeX</button></div>
<div id="aiPanel" class="ai-panel"><b>AI Assistant</b><div id="aiText" style="margin:7px 0"></div><button class="btn primary" onclick="applySuggestion()">Terapkan Saran</button> <button class="btn" onclick="hideSuggestion()">Abaikan</button></div></div>

<div class="card"><b>③ PREVIEW LANGSUNG</b><div id="preview" class="preview" style="margin-top:10px"></div></div>
<div class="card"><div class="head"><div><b>④ SIMPAN</b><div class="history" id="hist">Undo/Redo dan autosave aktif.</div></div><div class="tools" style="margin:0"><button class="btn" onclick="undo()">↶ Undo</button><button class="btn" onclick="redo()">↷ Redo</button><button class="btn" onclick="saveDraft()">💾 Draft</button><button class="btn primary" onclick="saveBank()">📚 Simpan ke Bank Soal Uji</button></div></div></div>
</div>
<script>
const $=x=>document.getElementById(x), symbols=['x²','x₁','√','a/b','Σ','∫','Δ','θ','π','∞','×10ⁿ','→','F⃗','v₀','Eₖ','Eₚ','ε','ρ','λ','ω','φ','ħ'];let undoStack=[],redoStack=[],suggestion=null;
symbols.forEach(s=>{let b=document.createElement('button');b.className='btn';b.textContent=s;b.onclick=()=>insertText(s);$('formula').appendChild(b)});
function insertText(t){let e=document.activeElement;if(!e||!['TEXTAREA','INPUT'].includes(e.tagName))e=$('question');let a=e.selectionStart||0,b=e.selectionEnd||a;e.value=e.value.slice(0,a)+t+e.value.slice(b);e.focus();e.selectionStart=e.selectionEnd=a+t.length;changed()}
function addFormula(){insertText('\\frac{a}{b}')}
function renderOptions(){let type=$('type').value,n=type==='pg4'?4:5,w=$('options');w.innerHTML='';$('optionsWrap').style.display=['isian','esai'].includes(type)?'none':'';if(['isian','esai'].includes(type))return;for(let i=0;i<n;i++){let x=document.createElement('input');x.placeholder=String.fromCharCode(65+i)+'. Opsi / pernyataan';x.dataset.opt=i;x.oninput=changed;w.appendChild(x)}}
function snapshot(){return JSON.stringify({q:$('question').value,e:$('explanation').value,k:$('key').value,o:[...document.querySelectorAll('[data-opt]')].map(x=>x.value)})}
function changed(){let s=snapshot();if(undoStack.at(-1)!==s){undoStack.push(s);if(undoStack.length>40)undoStack.shift()}redoStack=[];preview();clearTimeout(window.as);window.as=setTimeout(saveDraft,500)}
function restore(s){if(!s)return;let x=JSON.parse(s);$('question').value=x.q;$('explanation').value=x.e;$('key').value=x.k;[...document.querySelectorAll('[data-opt]')].forEach((e,i)=>e.value=x.o[i]||'');preview()}
function undo(){if(undoStack.length<2)return;redoStack.push(undoStack.pop());restore(undoStack.at(-1))}
function redo(){if(!redoStack.length)return;let s=redoStack.pop();undoStack.push(s);restore(s)}
function preview(){let q=$('question').value||'<i>Pertanyaan belum diisi</i>',opts=[...document.querySelectorAll('[data-opt]')].map((x,i)=>x.value?'<div><b>'+String.fromCharCode(65+i)+'.</b> '+esc(x.value)+'</div>':'').join('');$('preview').innerHTML='<div>'+rich(q)+'</div><div style="margin-top:8px">'+opts+'</div>'+( $('explanation').value?'<hr><b>Pembahasan:</b><div>'+rich($('explanation').value)+'</div>':'');if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('preview')]).catch(()=>{})}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function rich(s){return esc(s).replace(/\n/g,'<br>')}
function parseWorkspace(){let t=($('workspace').innerText||'').trim();if(!t&&!$('workspace').querySelector('img'))return alert('Masukkan bahan soal dahulu.');let lines=t.split(/\n+/).map(x=>x.trim()).filter(Boolean),opts=[];lines=lines.filter(x=>{let m=x.match(/^([A-E])[\.\)]\s*(.+)$/i);if(m){opts.push(m[2]);return false}return true});$('question').value=lines.join('\n');[...document.querySelectorAll('[data-opt]')].forEach((e,i)=>e.value=opts[i]||'');$('status').textContent='✓ Bahan disusun ke Editor. AI Vision backend akan disambungkan setelah UI/alur ini disetujui.';changed();$('question').scrollIntoView({behavior:'smooth'})}
function addImage(file){let r=new FileReader();r.onload=()=>{let im=document.createElement('img');im.src=r.result;im.className='inline';$('workspace').appendChild(im);$('status').textContent='✓ Gambar masuk pada posisi workspace. Siap dianalisis.'};r.readAsDataURL(file)}
$('img').onchange=e=>{if(e.target.files[0])addImage(e.target.files[0]);e.target.value=''};$('doc').onchange=e=>{$('status').textContent=e.target.files[0]?'✓ '+e.target.files[0].name+' dipilih. Parser Word/PDF backend belum disambungkan pada prototipe mandiri.':'Siap.'};
$('workspace').addEventListener('paste',e=>{let it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(it){e.preventDefault();addImage(it.getAsFile())}});
$('workspace').addEventListener('dragover',e=>e.preventDefault());$('workspace').addEventListener('drop',e=>{e.preventDefault();let f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));if(f)addImage(f)});
function aiSuggest(mode){let msg={rapikan:'Saran AI akan merapikan bahasa tanpa mengubah konsep fisika.',hitung:'AI Hitung Ulang akan menyelesaikan soal secara independen dan membandingkan kunci.',periksa:'AI Pemeriksa akan mengecek data, satuan, dimensi, simbol, kunci, opsi dan konsistensi pembahasan.',bahas:'AI akan membuat pembahasan langkah demi langkah.',variasi:'AI akan membuat variasi angka/kondisi tanpa mengubah kompetensi soal.',sulit:'AI akan menawarkan versi Mudah, Sedang, dan Sulit.',latex:'AI Vision akan mengubah rumus pada gambar menjadi LaTeX yang dapat diedit.'}[mode];suggestion=mode;$('aiText').textContent='⚠️ MODE UJI: '+msg+' AI belum mengubah soal otomatis sebelum Anda menekan Terapkan Saran.';$('aiPanel').classList.add('show')}
function applySuggestion(){$('aiText').textContent='Fungsi AI backend belum disambungkan pada prototipe mandiri ini. UI persetujuan sudah berfungsi agar AI tidak menimpa soal tanpa izin.'}
function hideSuggestion(){$('aiPanel').classList.remove('show');suggestion=null}
function data(){return{id:'Q-'+Date.now(),level:$('level').value,topic:$('topic').value,difficulty:$('difficulty').value,type:$('type').value,question:$('question').value,options:[...document.querySelectorAll('[data-opt]')].map(x=>x.value),key:$('key').value,explanation:$('explanation').value,score:+$('score').value||1,updatedAt:new Date().toISOString()}}
function saveDraft(){localStorage.setItem('kf_unified_test_draft',JSON.stringify(data()));$('hist').textContent='Draft otomatis tersimpan '+new Date().toLocaleTimeString()}
function saveBank(){let d=data();if(!d.question.trim())return alert('Pertanyaan belum diisi.');let a=JSON.parse(localStorage.getItem('kf_unified_test_bank')||'[]');a.push(d);localStorage.setItem('kf_unified_test_bank',JSON.stringify(a));alert('✓ Tersimpan ke Bank Soal Uji. Total '+a.length+' soal.')}
function clearWork(){$('workspace').innerHTML='';$('status').textContent='Workspace dibersihkan.'}
$('type').onchange=()=>{renderOptions();changed()};['question','explanation','key','score'].forEach(id=>$(id).addEventListener('input',changed));renderOptions();let d=localStorage.getItem('kf_unified_test_draft');if(d){try{let x=JSON.parse(d);$('question').value=x.question||'';$('explanation').value=x.explanation||'';$('key').value=x.key||'';[...document.querySelectorAll('[data-opt]')].forEach((e,i)=>e.value=(x.options||[])[i]||'')}catch(e){}}undoStack=[snapshot()];preview();
</script></body></html>
