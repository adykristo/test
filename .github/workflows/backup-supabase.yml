
name: Backup Supabase to Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read

jobs:
  backup:
    name: Backup Database
    runs-on: ubuntu-latest

    steps:
      - name: Periksa konfigurasi backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL belum tersedia"; exit 1; }
          test -n "$GOOGLE_DRIVE_TOKEN_JSON" || { echo "GOOGLE_DRIVE_TOKEN_JSON belum tersedia"; exit 1; }
          test -n "$GOOGLE_DRIVE_FOLDER_ID" || { echo "GOOGLE_DRIVE_FOLDER_ID belum tersedia"; exit 1; }
          echo "Konfigurasi dasar tersedia."
